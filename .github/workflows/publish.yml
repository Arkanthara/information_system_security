on:
  workflow_dispatch:
  push:
    branches: exam

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Add typst for ceTZ diagrams
        uses: typst-community/setup-typst@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install Python and Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install jupyter

      - name: Add Quizdown extension for Quarto
        run: |
          cd website/en
          quarto add parmsam/quarto-quizdown --no-prompt
          quarto install extension pandoc-ext/diagram --no-prompt
          cd ../fr
          quarto add parmsam/quarto-quizdown --no-prompt
          quarto install extension pandoc-ext/diagram --no-prompt
          cd ../..

      - name: Render French project
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: website/fr

      - name: Render English project
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: website/en

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/_site
          publish_branch: gh-pages
